---
- name: Configure Barcode Generator Environment
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Check Docker
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Show Docker version
      ansible.builtin.debug:
        msg: "{{ docker_version.stdout }}"

    - name: Check Kind
      ansible.builtin.command: kind --version
      register: kind_version
      changed_when: false

    - name: Show Kind version
      ansible.builtin.debug:
        msg: "{{ kind_version.stdout }}"

    - name: Check Kubernetes
      ansible.builtin.command: kubectl version --client
      register: kubectl_version
      changed_when: false

    - name: Show Kubernetes version
      ansible.builtin.debug:
        msg: "{{ kubectl_version.stdout }}"

    - name: Check Barcode Kubernetes Pods
      ansible.builtin.command: kubectl get pods
      register: pods
      changed_when: false

    - name: Show Barcode Pods
      ansible.builtin.debug:
        msg: "{{ pods.stdout }}"